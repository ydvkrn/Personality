
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <title>Video Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://json1.btfcompany1.workers.dev" crossorigin>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
        }

        /* Premium Water Glass Enter Button */

        #enterBtn {
            position: relative;
            isolation: isolate;
            overflow: hidden;

            padding: 27px 75px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.19),
                    rgba(255,255,255,0.035) 45%,
                    rgba(255,255,255,0.10)
                );

            color: rgba(255,255,255,0.96);

            font-family: 'Inter', sans-serif;
            font-size: clamp(2rem, 7vw, 4rem);
            font-weight: 300;

            letter-spacing: 12px;
            text-transform: uppercase;

            border: 1px solid rgba(255,255,255,0.48);
            border-radius: 5px;

            cursor: pointer;

            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.42),
                inset 0 -1px 1px rgba(255,255,255,0.08),
                0 8px 35px rgba(255,255,255,0.055),
                0 0 25px rgba(255,255,255,0.035);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;

            -webkit-tap-highlight-color: transparent;
        }

        /* Glass reflection */

        #enterBtn::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;

            background: linear-gradient(
                115deg,
                transparent 15%,
                rgba(255,255,255,0.17) 35%,
                rgba(255,255,255,0.035) 48%,
                transparent 65%
            );

            transform: translateX(-100%);
            transition: transform 0.65s ease;
        }

        /* Top glass highlight */

        #enterBtn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.85),
                transparent
            );

            opacity: 0.8;
        }

        @media (hover: hover) {
            #enterBtn:hover:not(:disabled) {
                background:
                    linear-gradient(
                        145deg,
                        rgba(255,255,255,0.27),
                        rgba(255,255,255,0.07),
                        rgba(255,255,255,0.15)
                    );

                border-color: rgba(255,255,255,0.8);

                box-shadow:
                    inset 0 1px 2px rgba(255,255,255,0.5),
                    0 10px 40px rgba(255,255,255,0.10);

                transform: translateY(-2px);
            }

            #enterBtn:hover:not(:disabled)::before {
                transform: translateX(100%);
            }
        }

        #enterBtn:active:not(:disabled) {
            transform: scale(0.97);
        }

        #enterBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Video Container */

        #videoContainer {
            display: none;

            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;
            height: 100dvh;

            background: #000;
            z-index: 9999;

            opacity: 0;
        }

        #videoContainer.show {
            display: block;
            opacity: 1;
            animation: fadeIn 0.25s ease forwards;
        }

        #videoPlayer {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            background: #000;

            outline: none;
        }

        /* Hide all native video controls */

        #videoPlayer::-webkit-media-controls {
            display: none !important;
        }

        #videoPlayer::-webkit-media-controls-enclosure {
            display: none !important;
        }

        #videoPlayer::-webkit-media-controls-panel {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Reduced motion support */

        @media (prefers-reduced-motion: reduce) {
            #enterBtn,
            #enterBtn::before {
                transition: none;
            }

            #videoContainer.show {
                animation: none;
                opacity: 1;
            }
        }

        /* Mobile optimization */

        @media (max-width: 600px) {
            #enterBtn {
                padding: 22px 45px;
                letter-spacing: 8px;
            }
        }
    </style>
</head>

<body>

    <button id="enterBtn" disabled>Loading...</button>

    <div id="videoContainer">
        <video
            id="videoPlayer"
            playsinline
            webkit-playsinline
            preload="auto"
            disablepictureinpicture
            controlslist="nodownload noplaybackrate noremoteplayback"
        ></video>
    </div>

    <script>
        (() => {
            'use strict';

            const API_URL =
                'https://json1.btfcompany1.workers.dev/msm.json';

            const enterBtn = document.getElementById('enterBtn');
            const videoContainer = document.getElementById('videoContainer');
            const videoPlayer = document.getElementById('videoPlayer');

            let videoReady = false;
            let entered = false;
            let retryCount = 0;

            const MAX_RETRIES = 2;
            const API_TIMEOUT = 10000;

            // Load video configuration

            async function loadVideoUrl() {
                try {
                    const controller = new AbortController();

                    const timeout = setTimeout(
                        () => controller.abort(),
                        API_TIMEOUT
                    );

                    let response;

                    try {
                        response = await fetch(API_URL, {
                            method: 'GET',
                            cache: 'no-cache',
                            signal: controller.signal,
                            headers: {
                                'Accept': 'application/json'
                            }
                        });
                    } finally {
                        clearTimeout(timeout);
                    }

                    if (!response.ok) {
                        throw new Error(
                            'API request failed: ' + response.status
                        );
                    }

                    const data = await response.json();

                    if (
                        !data ||
                        typeof data.videoUrl !== 'string' ||
                        !data.videoUrl.trim()
                    ) {
                        throw new Error('Invalid video URL');
                    }

                    const videoURL = new URL(
                        data.videoUrl,
                        location.href
                    );

                    if (
                        !['https:', 'http:'].includes(videoURL.protocol) ||
                        (location.protocol === 'https:' &&
                         videoURL.protocol !== 'https:')
                    ) {
                        throw new Error('Unsupported video URL');
                    }

                    // Initialize source once

                    videoPlayer.src = videoURL.href;
                    videoPlayer.load();

                    videoReady = true;

                    enterBtn.disabled = false;
                    enterBtn.textContent = 'ENTER';

                } catch (error) {
                    console.error('Video initialization failed:', error);

                    if (retryCount < MAX_RETRIES) {
                        retryCount++;

                        enterBtn.textContent = 'Retrying...';

                        setTimeout(
                            loadVideoUrl,
                            retryCount * 1000
                        );

                        return;
                    }

                    enterBtn.textContent = 'Error';
                    enterBtn.disabled = true;
                }
            }

            // Start playback immediately from user interaction

            enterBtn.addEventListener('click', () => {
                if (!videoReady || entered) return;

                entered = true;

                enterBtn.disabled = true;

                // Reveal player immediately

                videoContainer.classList.add('show');

                // Start playback directly within the click event

                const playPromise = videoPlayer.play();

                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.error('Playback failed:', error);

                        entered = false;
                        videoContainer.classList.remove('show');

                        enterBtn.disabled = false;
                        enterBtn.textContent = 'ENTER';
                    });
                }
            });

            // Hide context menu on video

            videoPlayer.addEventListener('contextmenu', event => {
                event.preventDefault();
            });

            // Start API request immediately

            loadVideoUrl();

        })();
    </script>

</body>
</html>
